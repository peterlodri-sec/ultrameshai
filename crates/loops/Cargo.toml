[package]
name = "loop-engineering-loops"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4"] }
loop-engineering-cognition = { path = "../cognition" }
loop-engineering-transport = { path = "../transport" }
loop-engineering-node-registry = { path = "../node-registry" }
milvus-brain = { path = "../milvus-brain" }
honcho = { path = "../honcho" }
memory-mesh = { path = "../memory-mesh" }
rig-core = { version = "0.11", optional = true }
schemars = { version = "0.8", optional = true }

[features]
rig = ["dep:rig-core", "dep:schemars", "loop-engineering-cognition/rig"]

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
