[package]
name = "milvus-brain"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
tempfile = "3.10"
