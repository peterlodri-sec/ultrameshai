[package]
name = "loop-engineering-cognition"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
prost = "0.14"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
