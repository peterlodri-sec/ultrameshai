[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# adk core — LlmRequest, Content, Part types
adk-core = { git = "https://github.com/zavora-ai/adk-rust" }

# adk model — OpenAICompatible for DashScope / Qwen
adk-model = { git = "https://github.com/zavora-ai/adk-rust", features = ["openai"] }

# adk session — InMemorySessionService
adk-session = { git = "https://github.com/zavora-ai/adk-rust" }

# adk tool — #[tool] macro
adk-tool = { git = "https://github.com/zavora-ai/adk-rust" }

# transport (local protobuf)
loop-engineering-transport = { path = "../transport" }

# async runtime
tokio = { version = "1.38", features = ["full"] }

# error handling
thiserror = "1.0"
anyhow = "1.0"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# async streams
futures = "0.3"

# uuid for session IDs
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
