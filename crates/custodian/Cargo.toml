[package]
name = "custodian"
version = "0.1.0"
edition = "2021"
description = "Custodian — provenance-guarded memory gatekeeper. OBSERVE/DERIVE/REJECT/ACCEPT events, warrant gate, record→admit→commit. Growth must not falsify ancestry."
license = "Apache-2.0"

[dependencies]
blake3 = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["serde"]
bench = []
serde = ["dep:serde"]
