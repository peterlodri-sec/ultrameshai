name: PR Manager
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  manage-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze changes
        id: analyze
        run: |
          # Get changed files
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Count changes
          count=$(echo "$files" | wc -l | tr -d ' ')
          echo "file_count=$count" >> "$GITHUB_OUTPUT"

          # Detect categories
          has_rust=$(echo "$files" | grep -c "\.rs$" || true)
          has_ts=$(echo "$files" | grep -c "\.ts$" || true)
          has_proto=$(echo "$files" | grep -c "^proto/" || true)
          has_docs=$(echo "$files" | grep -c "^docs/" || true)
          has_deps=$(echo "$files" | grep -c -E "(Cargo\.toml|package\.json|bun\.lockb)" || true)
          has_dogfeed=$(echo "$files" | grep -c "dogfeed\.json" || true)

          echo "has_rust=$has_rust" >> "$GITHUB_OUTPUT"
          echo "has_ts=$has_ts" >> "$GITHUB_OUTPUT"
          echo "has_proto=$has_proto" >> "$GITHUB_OUTPUT"
          echo "has_docs=$has_docs" >> "$GITHUB_OUTPUT"
          echo "has_deps=$has_deps" >> "$GITHUB_OUTPUT"
          echo "has_dogfeed=$has_dogfeed" >> "$GITHUB_OUTPUT"

          # Estimate review time (1 min per 10 lines, min 1 min)
          additions=$(git diff --numstat origin/${{ github.base_ref }}...HEAD 2>/dev/null | awk '{s+=$1} END {print s}' || echo "10")
          review_mins=$(( additions / 10 + 1 ))
          echo "review_minutes=$review_mins" >> "$GITHUB_OUTPUT"

      - name: Add labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [];
            if ('${{ steps.analyze.outputs.has_rust }}' !== '0') labels.push('rust');
            if ('${{ steps.analyze.outputs.has_ts }}' !== '0') labels.push('typescript');
            if ('${{ steps.analyze.outputs.has_proto }}' !== '0') labels.push('ipc');
            if ('${{ steps.analyze.outputs.has_docs }}' !== '0') labels.push('documentation');
            if ('${{ steps.analyze.outputs.has_deps }}' !== '0') labels.push('dependencies');
            if ('${{ steps.analyze.outputs.has_dogfeed }}' !== '0') labels.push('dogfeed');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.analyze.outputs.files }}`.split('\n').filter(f => f.trim());
            const labels = [];
            if ('${{ steps.analyze.outputs.has_rust }}' !== '0') labels.push('Rust');
            if ('${{ steps.analyze.outputs.has_ts }}' !== '0') labels.push('TypeScript');
            if ('${{ steps.analyze.outputs.has_proto }}' !== '0') labels.push('Proto');
            if ('${{ steps.analyze.outputs.has_docs }}' !== '0') labels.push('Docs');
            if ('${{ steps.analyze.outputs.has_deps }}' !== '0') labels.push('Deps');

            const body = `## PR Manager Summary

            **Files changed:** ${{ steps.analyze.outputs.file_count }}
            **Estimated review time:** ~${{ steps.analyze.outputs.review_minutes }} min
            **Categories:** ${labels.join(', ') || 'General'}

            ### Changed Files
            ${files.slice(0, 20).map(f => `- \`${f}\``).join('\n')}${files.length > 20 ? `\n- ... and ${files.length - 20} more` : ''}

            ${'${{ steps.analyze.outputs.has_dogfeed }}' !== '0' ? '> **Note:** dogfeed.json was modified. Ensure metadata is current.' : ''}

            ---
            *Auto-generated by PR Manager Agent*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
