syntax = "proto3";

package loop_engineering;

// Agent unit spawn request (yardmaster/loop -> unit)
message UnitSpawn {
  string unit_id = 1;
  string slice_id = 2;
  string loop_type = 3;        // "coder", "tester", "red-team", etc.
  string sandbox_tier = 4;     // "standard", "test", "red-team", "devops"
  string nix_shell = 5;        // nix shell path to instantiate
  uint32 memory_limit_mb = 6;  // soft cap (100), elastic to 150, kill at 160
  string assigned_node = 7;    // headscale node name, or empty for self-schedule
}

// Agent unit death report (unit -> mempalace)
message UnitStats {
  string unit_id = 1;
  string slice_id = 2;
  string loop_type = 3;
  uint64 spawned_at_ms = 4;
  uint64 died_at_ms = 5;
  uint32 peak_memory_mb = 6;
  string status = 7;            // "completed", "killed", "failed"
  string snapshot_path = 8;    // if killed at >160MB
  bytes stats_blob = 9;        // loop-specific telemetry (serialized)
}

// Slice assignment (yardmaster -> loop)
message SliceAssign {
  string slice_id = 1;
  string task_id = 2;
  string loop_type = 3;        // which loop owns this slice
  string spec = 4;             // slice spec (E2E capability description)
  repeated string dependencies = 5;  // other slice_ids this depends on
  string execution_mode = 6;   // "pipeline" or "wave"
}

// Node capacity heartbeat (node -> registry)
message NodeHeartbeat {
  string node_id = 1;          // headscale node name
  string node_type = 2;        // "vm" or "rpi"
  uint32 cpu_cores = 3;
  uint64 memory_total_mb = 4;
  uint64 memory_free_mb = 5;
  uint32 units_running = 6;
  repeated string capabilities = 7;  // "standard", "test", "red-team", "devops"
  uint64 timestamp_ms = 8;
}

// Research finding (any research agent -> milvus BRAIN)
message ResearchFinding {
  string finding_id = 1;
  string source_agent = 2;     // "deep-research", "junior-burst", "red-team-research"
  string topic = 3;
  string summary = 4;
  bytes embedding = 5;         // vector embedding
  repeated string tags = 6;
  uint64 timestamp_ms = 7;
}

// Ralph coaching hint (ralph -> loop)
message RalphHint {
  string ralph_id = 1;
  string target_loop = 2;      // which loop to coach
  string hint = 3;
  string severity = 4;         // "info", "warn", "critical"
  uint64 timestamp_ms = 5;
}

// Learning pattern detected by honcho daemon
message LearningPattern {
  string pattern_id = 1;
  string pattern_type = 2;     // "performance", "failure", "success", "cross-loop"
  float confidence = 3;        // 0.0-1.0
  repeated string affected_loops = 4;
  int64 evidence_count = 5;
  string summary = 6;
  bytes embedding = 7;         // vector embedding (1536 floats)
  bytes metadata = 8;          // JSON metadata (correlation, p-values)
  uint64 created_at_ms = 9;
}

// Graph triple for relationship-aware retrieval
message GraphTriple {
  string subject = 1;
  string predicate = 2;
  string object = 3;
}

enum Classification {
  CLASSIFICATION_UNSPECIFIED = 0;
  CLASSIFICATION_FACT = 1;
  CLASSIFICATION_EVENT = 2;
  CLASSIFICATION_INSTRUCTION = 3;
  CLASSIFICATION_TASK = 4;
}

// Pruned context entry (kompress circulator -> milvus)
message PrunedContextEntry {
  string session_id = 1;
  string agent_type = 2;
  string message_role = 3;
  string content_hash = 4;
  Classification classification = 5;
  string topic_key = 6;
  string superseded_by = 7;
  repeated GraphTriple triples = 8;
  string residual = 9;
  uint64 timestamp_ms = 10;
}

// File context sidecar (.kompress/files/<path>.json)
message FileContextSidecar {
  string file_path = 1;
  string last_mutated_commit = 2;
  string architectural_intent = 3;
  repeated string known_quirks = 4;
  repeated string dependencies = 5;
  repeated GraphTriple triples = 6;
}

// Handover brief (.kompress/HANDOVER.md)
message HandoverBrief {
  string source_agent = 1;
  string target_agent = 2;
  string status = 3;
  string intent_summary = 4;
  string last_error = 5;
  repeated string critical_files = 6;
  repeated string next_steps = 7;
  uint64 timestamp_ms = 8;
}